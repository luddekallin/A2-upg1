<!DOCTYPE html>
<html lang='en'>
<head>

    <title>CSS To-do list Upg 1</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>

        <div class="box-content">

            </ul>
        </div>
        
    </section>

    <script src="script.js"></script>
